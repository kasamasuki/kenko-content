name: schedule-post
on:
  push:
    branches: [main]
    paths: ["ops/queue/*.json", "ops/captions/*.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: buffer
  cancel-in-progress: false
jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Use the latest posted.log
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schedule queued posts on Buffer
        env:
          BUFFER_KEY: ${{ secrets.BUFFER_KEY }}
        run: python3 ops/run_queue.py
      - name: Commit posted.log
        if: always()
        run: |
          git config user.name "kenko-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/posted.log
          git diff --cached --quiet || { git commit -m "Log scheduled post" && git pull --rebase && git push; }
