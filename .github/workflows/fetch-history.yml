name: fetch-history
on:
  schedule:
    - cron: "17 20 * * 0"   # Monday 7:17am Melbourne (AEDT)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: buffer
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Buffer stats (kept out of the repo)
        env:
          BUFFER_KEY: ${{ secrets.BUFFER_KEY }}
        run: python3 ops/fetch_history.py
      - name: Write weekly summary
        run: |
          python3 ops/weekly_summary.py ops/post_history.json > ops/weekly-summary.md
          cat ops/weekly-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit weekly summary
        run: |
          git config user.name "kenko-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/weekly-summary.md
          git diff --cached --quiet || { git commit -m "Weekly summary" && git pull --rebase && git push; }
