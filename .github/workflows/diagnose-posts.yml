name: diagnose-posts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buffer
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show Buffer post status and errors (read-only)
        env:
          BUFFER_KEY: ${{ secrets.BUFFER_KEY }}
        run: python3 ops/diagnose_posts.py
